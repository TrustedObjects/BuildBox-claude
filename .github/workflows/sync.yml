# Publish the Claude Code skills of a BuildBox release into this marketplace.
#
# Manual button after a BuildBox release, plus a daily safety net which does
# nothing when the latest stable release is already published. The result is
# always proposed as a pull request, never pushed to the default branch.
name: Sync BuildBox skills

on:
  workflow_dispatch:
    inputs:
      tag:
        description: BuildBox tag to publish, empty for the latest stable release
        required: false
        type: string
      dry_run:
        description: Generate and check only, without opening a pull request
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the marketplace
        uses: actions/checkout@v4

      - name: Assemble the plugin from the BuildBox release
        id: sync
        run: scripts/sync.sh "${{ inputs.tag }}" | tee -a "${GITHUB_OUTPUT}"

      - name: Nothing to publish
        if: steps.sync.outputs.changed != 'true'
        run: echo "BuildBox ${{ steps.sync.outputs.tag }} needs no publication."

      - name: Show what would change
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run
        run: |
          git --no-pager diff --stat
          echo "Dry run: no pull request opened."

      - name: Propose the update as a pull request
        if: steps.sync.outputs.changed == 'true' && ! inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.sync.outputs.tag }}
          SHA: ${{ steps.sync.outputs.sha }}
        run: |
          set -e
          branch="sync/buildbox-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A
          git commit \
            --message "Sync BuildBox ${TAG}" \
            --message "Skills and reference generated from BuildBox ${TAG} (${SHA})."
          git push --force-with-lease origin "${branch}"
          if [ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')" ]; then
            echo "Pull request already open for ${branch}, updated by this push."
          else
            gh pr create \
              --head "${branch}" \
              --title "Sync BuildBox ${TAG}" \
              --body "Generated from [BuildBox ${TAG}](https://github.com/TrustedObjects/BuildBox/releases/tag/${TAG}) (\`${SHA}\`) by \`scripts/sync.sh\`.

          Review the diff, then merge to publish. Tag this repository \`${TAG}\` afterwards so the official directory can pin it."
          fi
